[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = 'cancun'
optimizer = true
optimizer_runs = 200


ffi = true
fs_permissions = [{ access = "read-write", path = "./scripts/jsons/"}, { access = "read", path = "./scripts/configs/"}]

# RPC retry/backoff for rate-limited endpoints
rpc_timeout = 120
retries = 5
delay = 3

[rpc_endpoints]
alchemy = "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"

[fmt]
line_length = 120
single_line_statement_blocks = 'multi'
multiline_func_header = 'attributes_first'
contract_new_lines = false
override_spacing = false
tab_width = 4
bracket_spacing = false
int_types = 'long'
quote_style = 'double'
number_underscore = 'remove'
sort_imports = true
ignore=["out/**/*.sol", "lib/**/*.sol"]


[lint]
ignore=["test/**/*.sol"]
severity=["high", "med"]
exclude_lints=["unchecked-call"]